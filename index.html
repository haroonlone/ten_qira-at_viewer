<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="مقارنة القراءات العشر من مصاحف التيسير - اختر القراءات وعدد الأعمدة وقارن بينها">
<meta name="author" content="هارون رشيد لون">
<title>المقارنة التفاعلية لمصاحف القراءات العشر</title>
<style>
:root{--navy:#1e3a5f;--navy2:#2a4a7a;--bg:#f5f5f5;--card:#fff;--text:#1b1f24;--line:#d9dde3;--soft:#eef1f5;--accent:#1e3a5f;--on:#fff}
:root[data-theme=dark]{--navy:#3b6aa8;--navy2:#4a7bc0;--bg:#12161c;--card:#1c222b;--text:#e6e9ee;--line:#333c49;--soft:#262e3a;--accent:#7fb0ee;--on:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:linear-gradient(135deg,#1e3a5f,#2a4a7a);color:#fff;text-align:center;padding:14px 20px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header h1{margin:0;font-size:clamp(20px,4vw,32px)}
button,input,select{font:inherit;font-size:15px;padding:7px 14px;border-radius:8px;border:1.5px solid var(--navy);cursor:pointer;color:var(--text);background:var(--card)}
button{background:var(--navy);color:var(--on);font-weight:bold}
button:hover{background:var(--navy2)}
button.ghost{background:var(--card);color:var(--text);border-color:var(--line);font-weight:normal}
button.ghost:hover{background:var(--soft)}
button.on{background:var(--navy);color:var(--on);border-color:var(--navy);font-weight:bold}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#pageInput{width:84px;text-align:center}
select{max-width:170px}
.bar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.06);padding:10px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.row+.row{margin-top:8px}
.lbl{font-size:14px;color:var(--text);opacity:.75}
.seg{display:flex;gap:4px;align-items:center}
.seg button{padding:5px 11px;min-width:38px}
details{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
summary{cursor:pointer;padding:8px 14px;font-weight:bold}
.panel{padding:4px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;user-select:none}
.chip input{width:auto;padding:0;margin:0;accent-color:var(--navy)}
.chip.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;padding:18px;max-width:1800px;margin:0 auto}
.card{background:var(--card);padding:6px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1);display:flex;flex-direction:column;min-width:0}
.title{display:flex;align-items:center;gap:4px;background:var(--navy);color:#fff;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-weight:bold}
.title .t{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.ic{cursor:pointer;padding:0 6px;font-size:20px;user-select:none;background:none;border:0;color:#fff;min-width:0;font-weight:bold}
.ic:hover{color:#ffd700;background:none}
.thumb{width:100%;height:auto;aspect-ratio:3/4;border:2px solid var(--line);border-radius:8px;cursor:zoom-in;background:var(--soft);object-fit:cover;transition:opacity .2s}
.thumb.loading{opacity:.45}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;opacity:.8}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);flex-direction:column;align-items:center;z-index:1000;padding:10px}
.mbar{display:flex;gap:8px;align-items:center;width:100%;max-width:1100px;margin-bottom:8px}
.mbar .mt{flex:1;text-align:center;background:var(--navy);color:#fff;font-weight:bold;padding:7px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar button{background:var(--navy);padding:6px 12px;min-width:0;color:#fff;border-color:#4a6a95}
.mwrap{flex:1;overflow:auto;width:100%;display:flex;justify-content:center;align-items:flex-start;min-height:0}
#zoomImage{max-width:none;border-radius:8px;border:3px solid #fff;background:#fff}
.hint{color:rgba(255,255,255,.7);font-size:13px;margin-top:6px;text-align:center}
.err{opacity:.6}
[hidden]{display:none!important}
.ibox{position:relative}.ibox img{display:block}
.card.ref .title{background:#1d6b4f}
.hl{position:absolute;border:2px solid;border-radius:3px;pointer-events:none}
.hl[data-n]::after{content:"📝";position:absolute;top:-11px;right:-5px;font-size:14px}
.ann .hl{pointer-events:auto;cursor:pointer}
.ann .ibox{cursor:crosshair;touch-action:none}.ann .thumb{cursor:crosshair}
.sw{width:28px;height:28px;min-width:0;padding:0;border-radius:50%}
.sw.cur{outline:3px solid var(--text);outline-offset:2px}
.notes div{font-size:13px;padding:4px 8px;margin-top:4px;border-right:4px solid;background:var(--soft);border-radius:6px;text-align:right}
@media(max-width:600px){button,input,select{font-size:14px}.grid{gap:8px;padding:8px}.title .t{font-size:13px}.hint{display:none}}
@media print{.bar,.modal,.ic{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="header"><h1>المقارنة التفاعلية لمصاحف القراءات العشر</h1></header>

<nav class="bar" aria-label="أدوات التحكم">
  <div class="row">
    <button onclick="go(-1)" title="الصفحة السابقة" aria-label="الصفحة السابقة">→</button>
    <input type="number" id="pageInput" min="0" max="612" value="0" aria-label="رقم الصفحة">
    <button onclick="go(1)" title="الصفحة التالية" aria-label="الصفحة التالية">←</button>
    <select id="surahSel" aria-label="السورة"><option value="">السورة</option></select>
    <select id="juzSel" aria-label="الجزء"><option value="">الجزء</option></select>
    <button class="ghost" id="themeBtn" title="الوضع الليلي">🌙</button>
  </div>
  <div class="row">
    <span class="lbl">الأعمدة:</span>
    <select id="colSel" aria-label="عدد الأعمدة"></select>
    <button class="ghost" id="refBtn" title="تثبيت قراءة مرجعية ومقارنتها بأخرى">📌 وضع المرجع</button>
    <button class="ghost" id="annBtn" title="تظليل الفروق وكتابة ملاحظات">✏️ تعليم الفروق</button>
  </div>
  <div class="row" id="refRow" hidden>
    <span class="lbl">المرجع:</span><select id="refSel"></select>
    <span class="lbl">المقارنة:</span>
    <button class="ghost" id="cPrev" title="القراءة السابقة">→</button>
    <select id="cmpSel"></select>
    <button class="ghost" id="cNext" title="القراءة التالية">←</button>
    <button class="ghost" id="swapBtn" title="تبديل المرجع والمقارنة">⇄</button>
  </div>
  <div class="row" id="annRow" hidden>
    <span class="lbl">اسحب على الصورة لتظليل موضع الفرق، وانقر على التظليل للتعديل أو الحذف</span>
    <span class="seg" id="swatches"></span>
    <button class="ghost" id="undoBtn">تراجع</button>
    <button class="ghost" id="clrBtn">مسح تعليم الصفحة</button>
    <button class="ghost" id="expBtn">تصدير</button>
    <button class="ghost" id="impBtn">استيراد</button>
    <input type="file" id="impFile" accept=".json" hidden>
    <input id="pageNote" placeholder="ملاحظة على الصفحة" style="width:min(320px,95%);text-align:right;cursor:text">
  </div>
  <details id="pick">
    <summary id="pickSum">اختيار القراءات</summary>
    <div class="panel">
      <div class="row" id="presets"></div>
      <div class="chips" id="chips"></div>
    </div>
  </details>
</nav>

<main><div class="grid" id="grid"></div></main>

<div class="modal" id="zoomModal" role="dialog" aria-modal="true" aria-label="عرض مكبر">
  <div class="mbar">
    <button id="zPrev" title="الصفحة السابقة (→)">→</button>
    <button id="zUp" title="القراءة السابقة (↑)">▲</button>
    <div class="mt" id="zoomTitle"></div>
    <button id="zDown" title="القراءة التالية (↓)">▼</button>
    <button id="zNext" title="الصفحة التالية (←)">←</button>
    <button id="zOut" title="تصغير (-)">−</button>
    <button id="zIn" title="تكبير (+)">+</button>
    <button id="zClose" title="إغلاق (Esc)">✕</button>
  </div>
  <div class="mwrap" id="mwrap"><div id="zbox" class="ibox" style="display:inline-block"><img id="zoomImage" alt=""></div></div>
  <div class="hint">← → تغيير الصفحة · ↑ ↓ تغيير القراءة · + − تكبير · Esc إغلاق</div>
</div>

<noscript><p style="text-align:center;padding:40px">يرجى تفعيل JavaScript لاستخدام هذه الصفحة.</p></noscript>

<script>
(function(){
"use strict";
const BASE=".", MAX=612, OFF=4;
const R=[
 ["حفص عن عاصم","حفص_عن_عاصم"],["قالون عن نافع","قالون_عن_نافع"],["ورش عن نافع","ورش_عن_نافع"],
 ["ابن كثير المكي","ابن_كثير_المكي"],["الدوري عن أبي عمرو","الدوري_عن_أبي_عمرو"],["السوسي عن أبي عمرو","السوسي_عن_أبي_عمرو"],
 ["هشام عن ابن عامر","هشام_عن_ابن_عامر"],["ابن ذكوان عن ابن عامر","ابن_ذكوان_عن_ابن_عامر"],["شعبة عن عاصم","شعبة_عن_عاصم"],
 ["خلف عن حمزة","خلف_عن_حمزة"],["خلاد عن حمزة","خلاد_عن_حمزة"],["الكسائي الكوفي","الكسائي_الكوفي"],
 ["أبو جعفر المدني","أبو_جعفر_المدني"],["يعقوب الحضرمي","يعقوب_الحضرمي"],["خلف العاشر","خلف_العاشر"]
];
const PRESETS=[
 ["الكل",R.map((_,i)=>i)],["حفص وورش",[0,2]],["حفص وقالون وورش",[0,1,2]],["حفص وقالون وورش والدوري",[0,1,2,4]],
 ["عن نافع",[1,2]],["عن عاصم",[0,8]],["عن أبي عمرو",[4,5]],["عن ابن عامر",[6,7]],["عن حمزة",[9,10]],
 ["القراءات الثلاث المتممة",[12,13,14]],["مسح",[]]
];
const S="الفاتحة:1,البقرة:2,آل عمران:50,النساء:77,المائدة:106,الأنعام:128,الأعراف:151,الأنفال:177,التوبة:187,يونس:208,هود:221,يوسف:235,الرعد:249,ابراهيم:255,الحجر:262,النحل:267,الإسراء:282,الكهف:293,مريم:305,طه:312,الأنبياء:322,الحج:332,المؤمنون:342,النور:350,الفرقان:359,الشعراء:367,النمل:377,القصص:385,العنكبوت:396,الروم:404,لقمان:411,السجدة:415,الأحزاب:418,سبأ:428,فاطر:434,يس:440,الصافات:446,ص:453,الزمر:458,غافر:467,فصلت:477,الشورى:483,الزخرف:489,الدخان:496,الجاثية:499,الأحقاف:502,محمد:507,الفتح:511,الحجرات:515,ق:518,الذاريات:520,الطور:523,النجم:526,القمر:528,الرحمن:531,الواقعة:534,الحديد:537,المجادلة:542,الحشر:545,الممتحنة:549,الصف:551,الجمعة:553,المنافقون:554,التغابن:556,الطلاق:558,التحريم:560,الملك:562,القلم:564,الحاقة:566,المعارج:568,نوح:570,الجن:572,المزمل:574,المدثر:575,القيامة:577,الإنسان:578,المرسلات:580,النبأ:582,النازعات:583,عبس:585,التكوير:586,الانفطار:587,المطففين:587,الانشقاق:589,البروج:590,الطارق:591,الأعلى:591,الغاشية:592,الفجر:593,البلد:594,الشمس:595,الليل:595,الضحى:596,الشرح:596,التين:597,العلق:597,القدر:598,البينة:598,الزلزلة:599,العاديات:599,القارعة:600,التكاثر:600,العصر:601,الهمزة:601,الفيل:601,قريش:602,الماعون:602,الكوثر:602,الكافرون:603,النصر:603,المسد:603,الإخلاص:604,الفلق:604,الناس:604";
const surahs=S.split(",").map(x=>{const[a,b]=x.split(":");return{name:a,page:+b}});
const juz=[1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];

const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem("qr_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem("qr_"+k,JSON.stringify(v))}catch(e){}};

let page=0, sel=load("sel",R.map((_,i)=>i)).filter(i=>R[i]), cols=load("cols",0),
    theme=load("theme",matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"), zi=0, zz=1,
    refOn=load("refOn",false), ref=load("ref",0), cmp=load("cmp",1), ann=false, color=load("color","#f5b800"),
    marks=load("marks",{}), pnotes=load("pnotes",{}), hist=[];
const list=()=>refOn?[ref,cmp]:sel;
const hp=parseInt((location.hash.match(/p=(\d+)/)||[])[1]);
if(hp>=0&&hp<=MAX)page=hp;

const imgNum=p=>p===0?1:p+OFF;
const src=(i,p)=>`${BASE}/${encodeURIComponent(R[i][1])}/page${String(imgNum(p)).padStart(3,"0")}.webp`;
const effCols=()=>{const n=list().length||1;const maxFit=Math.max(1,Math.floor((innerWidth-40)/(innerWidth<600?150:290)));
  return Math.max(1,Math.min(cols||n,n,maxFit>0?maxFit:1))};

function init(){
  surahs.forEach(s=>{const o=document.createElement("option");o.value=s.page;o.textContent=s.name;$("surahSel").appendChild(o)});
  juz.forEach((p,i)=>{const o=document.createElement("option");o.value=p;o.textContent="الجزء "+(i+1);$("juzSel").appendChild(o)});
  $("colSel").onchange=e=>{cols=+e.target.value;save("cols",cols);apply()};
  PRESETS.forEach(([t,ids])=>{const b=document.createElement("button");b.className="ghost";b.textContent=t;
    b.onclick=()=>{sel=ids.slice();save("sel",sel);buildChips();render()};$("presets").appendChild(b)});
  $("surahSel").onchange=e=>{if(e.target.value)setPage(+e.target.value)};
  $("juzSel").onchange=e=>{if(e.target.value)setPage(+e.target.value)};
  $("pageInput").onchange=()=>{const p=parseInt($("pageInput").value);
    if(p>=0&&p<=MAX)setPage(p);else $("pageInput").value=page};
  $("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";save("theme",theme);apply()};
  $("zPrev").onclick=()=>zPage(-1);$("zNext").onclick=()=>zPage(1);
  $("zUp").onclick=()=>zQ(-1);$("zDown").onclick=()=>zQ(1);
  $("zIn").onclick=()=>zoomBy(.25);$("zOut").onclick=()=>zoomBy(-.25);$("zClose").onclick=closeZ;
  $("zoomModal").addEventListener("click",e=>{if(e.target.id==="zoomModal"||e.target.id==="mwrap")closeZ()});
  let sx=0;
  $("zoomModal").addEventListener("touchstart",e=>{sx=e.changedTouches[0].screenX},{passive:true});
  $("zoomModal").addEventListener("touchend",e=>{const d=sx-e.changedTouches[0].screenX;
    if(zz===1&&Math.abs(d)>60)zPage(d>0?-1:1)},{passive:true});
  document.addEventListener("keydown",keys);
  addEventListener("resize",apply);
  addEventListener("hashchange",()=>{const p=parseInt((location.hash.match(/p=(\d+)/)||[])[1]);
    if(p>=0&&p<=MAX&&p!==page){page=p;render()}});
  R.forEach((r,i)=>["refSel","cmpSel"].forEach(id=>{const o=document.createElement("option");o.value=i;o.textContent=r[0];$(id).appendChild(o)}));
  $("refSel").onchange=e=>{ref=+e.target.value;if(cmp===ref)cmp=(ref+1)%R.length;saveRef();render()};
  $("cmpSel").onchange=e=>{cmp=+e.target.value;if(cmp===ref)ref=(cmp+1)%R.length;saveRef();render()};
  const step=d=>{let c=cmp;do{c=(c+d+R.length)%R.length}while(c===ref);cmp=c;saveRef();render()};
  $("cPrev").onclick=()=>step(-1);$("cNext").onclick=()=>step(1);
  $("swapBtn").onclick=()=>{[ref,cmp]=[cmp,ref];saveRef();render()};
  $("refBtn").onclick=()=>{refOn=!refOn;save("refOn",refOn);render()};
  $("annBtn").onclick=()=>{ann=!ann;apply()};
  ["#f5b800","#e5484d","#2f9e44"].forEach(c=>{const b=document.createElement("button");b.className="sw";b.dataset.c=c;b.style.background=c;
    b.title="لون التظليل";b.onclick=()=>{color=c;save("color",c);apply()};$("swatches").appendChild(b)});
  $("undoBtn").onclick=()=>{const k=hist.pop();if(k&&marks[k]){marks[k].pop();if(!marks[k].length)delete marks[k];save("marks",marks);paintAll()}};
  $("clrBtn").onclick=()=>{if(!confirm("مسح كل التعليمات على هذه الصفحة؟"))return;list().forEach(ri=>delete marks[ri+":"+page]);save("marks",marks);paintAll()};
  $("pageNote").oninput=e=>{const v=e.target.value;if(v.trim())pnotes[page]=v;else delete pnotes[page];save("pnotes",pnotes)};
  $("expBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({marks,pnotes})],{type:"application/json"}));
    a.download="qiraat-notes.json";a.click();URL.revokeObjectURL(a.href)};
  $("impBtn").onclick=()=>$("impFile").click();
  $("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{try{const d=JSON.parse(t);Object.keys(d.marks||{}).forEach(k=>marks[k]=(marks[k]||[]).concat(d.marks[k]));
      Object.assign(pnotes,d.pnotes||{});save("marks",marks);save("pnotes",pnotes);render()}catch(x){alert("ملف غير صالح")}});e.target.value=""};
  attach($("zbox"),()=>list()[zi]);
  buildChips();apply();render();
}
const saveRef=()=>{save("ref",ref);save("cmp",cmp)};

function buildChips(){
  const c=$("chips");c.innerHTML="";
  R.forEach((r,i)=>{const l=document.createElement("label");l.className="chip"+(sel.includes(i)?" sel":"");
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=sel.includes(i);
    cb.onchange=()=>{toggle(i,cb.checked)};
    l.appendChild(cb);l.appendChild(document.createTextNode(r[0]));c.appendChild(l)});
  $("pickSum").textContent=`اختيار القراءات (${sel.length} من ${R.length})`;
}
function toggle(i,on){
  sel=on?[...sel,i].sort((a,b)=>a-b):sel.filter(x=>x!==i);
  save("sel",sel);buildChips();render();
}

function apply(){
  document.documentElement.dataset.theme=theme;
  $("themeBtn").textContent=theme==="dark"?"☀️":"🌙";
  $("refRow").hidden=!refOn;$("annRow").hidden=!ann;$("pick").hidden=refOn;
  $("refBtn").classList.toggle("on",refOn);$("annBtn").classList.toggle("on",ann);
  document.body.classList.toggle("ann",ann);$("refSel").value=ref;$("cmpSel").value=cmp;
  document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("cur",b.dataset.c===color));
  $("grid").style.setProperty("--cols",effCols());
  const cs=$("colSel"),mx=Math.min(6,Math.max(1,list().length));
  if(+cs.dataset.mx!==mx){cs.dataset.mx=mx;cs.innerHTML="";
    for(let v=0;v<=mx;v++){const o=document.createElement("option");o.value=v;o.textContent=v?v+(v===1?" عمود":" أعمدة"):"تلقائي";cs.appendChild(o)}}
  cs.value=Math.min(cols,mx);
}

function setPage(p){page=Math.max(0,Math.min(MAX,p));render()}
function go(d){setPage(page+d)}
window.go=go;

function syncSelectors(){
  let s="",j="";
  if(page>0){
    for(let i=0;i<surahs.length;i++)if(surahs[i].page<=page)s=surahs[i].page;
    for(let i=0;i<juz.length;i++)if(juz[i]<=page)j=juz[i];
  }
  $("surahSel").value=s;$("juzSel").value=j;
}

function render(){
  $("pageInput").value=page;
  syncSelectors();apply();
  $("pageNote").value=pnotes[page]||"";
  history.replaceState(null,"","#p="+page);
  const g=$("grid");g.innerHTML="";
  const L=list();
  if(!L.length){g.innerHTML='<div class="empty">لم تختر أي قراءة. افتح «اختيار القراءات» وحدد قراءة أو أكثر.</div>';return}
  L.forEach((ri,idx)=>{
    const card=document.createElement("div");card.className="card"+(refOn&&idx===0?" ref":"");
    const t=document.createElement("div");t.className="title";
    const mk=(txt,fn,lab)=>{const b=document.createElement("button");b.className="ic";b.textContent=txt;b.title=lab;b.setAttribute("aria-label",lab);
      b.onclick=e=>{e.stopPropagation();fn()};return b};
    const name=document.createElement("span");name.className="t";name.textContent=(refOn&&idx===0?"📌 ":"")+R[ri][0];
    t.append(mk("→",()=>go(-1),"الصفحة السابقة"),name,mk("←",()=>go(1),"الصفحة التالية"));
    if(!refOn)t.append(mk("✕",()=>toggle(ri,false),"إخفاء هذه القراءة"));
    const box=document.createElement("div");box.className="ibox";box.dataset.ri=ri;
    const img=document.createElement("img");img.className="thumb loading";img.loading="lazy";img.draggable=false;
    img.src=src(ri,page);img.alt=`${R[ri][0]} - صفحة ${page}`;
    img.decoding="async";
    img.onload=()=>img.classList.remove("loading");
    img.onerror=()=>{img.classList.remove("loading");img.classList.add("err");
      img.src="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='300' height='400' fill='#e6e8ec'/><text x='150' y='200' font-family='Arial' font-size='18' fill='#888' text-anchor='middle'>الصورة غير متوفرة</text></svg>")};
    img.onclick=()=>{if(!ann)openZ(idx)};
    box.appendChild(img);
    const nt=document.createElement("div");nt.className="notes";
    card.append(t,box,nt);g.appendChild(card);
    attach(box,()=>ri);paint(box,ri);
  });
}

/* ---- highlights & notes ---- */
function paint(box,ri){
  box.querySelectorAll(".hl").forEach(n=>n.remove());
  const nt=box.nextElementSibling&&box.nextElementSibling.classList.contains("notes")?box.nextElementSibling:null;
  if(nt)nt.innerHTML="";
  (marks[ri+":"+page]||[]).forEach((m,k)=>{
    const d=document.createElement("div");d.className="hl";
    Object.assign(d.style,{left:m.x*100+"%",top:m.y*100+"%",width:m.w*100+"%",height:m.h*100+"%",borderColor:m.c,background:m.c+"40"});
    if(m.n){d.dataset.n="1";d.title=m.n;
      if(nt){const p=document.createElement("div");p.textContent="📝 "+m.n;p.style.borderColor=m.c;nt.appendChild(p)}}
    d.onclick=e=>{if(ann){e.stopPropagation();editMark(ri,k)}};
    box.appendChild(d);
  });
}
function paintAll(){
  document.querySelectorAll("#grid .ibox").forEach(b=>paint(b,+b.dataset.ri));
  if(open()&&list()[zi]!=null)paint($("zbox"),list()[zi]);
}
function editMark(ri,k){
  const key=ri+":"+page,a=marks[key],m=a[k];
  const n=prompt("ملاحظة على هذا التظليل (اتركها فارغة لإزالة الملاحظة). زر «إلغاء» يعرض خيار الحذف:",m.n||"");
  if(n===null){if(confirm("حذف هذا التظليل؟")){a.splice(k,1);if(!a.length)delete marks[key]}}
  else m.n=n.trim();
  save("marks",marks);paintAll();
}
function attach(box,getRi){
  box.addEventListener("pointerdown",e=>{
    if(!ann||e.target.classList.contains("hl")||e.button>0)return;
    e.preventDefault();
    const r=box.getBoundingClientRect(),cl=v=>Math.max(0,Math.min(1,v));
    const x0=cl((e.clientX-r.left)/r.width),y0=cl((e.clientY-r.top)/r.height);
    const d=document.createElement("div");d.className="hl";d.style.borderColor=color;d.style.background=color+"40";box.appendChild(d);
    let x=x0,y=y0;
    const mv=ev=>{x=cl((ev.clientX-r.left)/r.width);y=cl((ev.clientY-r.top)/r.height);
      Object.assign(d.style,{left:Math.min(x,x0)*100+"%",top:Math.min(y,y0)*100+"%",width:Math.abs(x-x0)*100+"%",height:Math.abs(y-y0)*100+"%"})};
    const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
      d.remove();const w=Math.abs(x-x0),h=Math.abs(y-y0);if(w<.01||h<.01)return;
      const n=prompt("ملاحظة على هذا الموضع (اختياري):","");if(n===null)return;
      const ri=getRi(),key=ri+":"+page;
      (marks[key]=marks[key]||[]).push({x:Math.min(x,x0),y:Math.min(y,y0),w,h,c:color,n:n.trim()});
      hist.push(key);save("marks",marks);paintAll()};
    addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });
}
function preloadZ(ri){[page+1,page-1].forEach(q=>{if(q>=0&&q<=MAX){const m=new Image();m.src=src(ri,q)}})}

/* ---- zoom ---- */
const open=()=>$("zoomModal").style.display==="flex";
function openZ(idx){zi=idx;zz=1;$("zoomModal").style.display="flex";document.body.style.overflow="hidden";showZ()}
function closeZ(){$("zoomModal").style.display="none";document.body.style.overflow=""}
function showZ(){
  const ri=list()[zi];if(ri==null)return closeZ();
  $("zoomImage").src=src(ri,page);$("zoomImage").alt=R[ri][0];
  $("zoomTitle").textContent=`${R[ri][0]} — صفحة ${page}`;preloadZ(ri);
  zoomBy(0);$("mwrap").scrollTop=0;paint($("zbox"),ri);
}
function zoomBy(d){zz=Math.max(.5,Math.min(3,zz+d));
  const im=$("zoomImage"),zb=$("zbox");
  zb.style.transform="";im.style.maxWidth="none";im.style.maxHeight="none";
  im.style.width=Math.round(zz*Math.min(innerWidth-30,1000))+"px";
}
function zPage(d){const p=page+d;if(p<0||p>MAX)return;page=p;render();showZ()}
function zQ(d){const n=list().length;if(!n)return;zi=(zi+d+n)%n;showZ()}

function keys(e){
  const tag=(e.target.tagName||"").toLowerCase();
  if(open()){
    const m={ArrowLeft:()=>zPage(1),ArrowRight:()=>zPage(-1),ArrowUp:()=>zQ(-1),ArrowDown:()=>zQ(1),
      Escape:closeZ,"+":()=>zoomBy(.25),"=":()=>zoomBy(.25),"-":()=>zoomBy(-.25)};
    if(m[e.key]){e.preventDefault();m[e.key]()}return}
  if(tag==="input"||tag==="select"||tag==="textarea")return;
  const m={ArrowLeft:()=>go(1),ArrowRight:()=>go(-1),Home:()=>setPage(0),End:()=>setPage(MAX),
    PageUp:()=>go(-10),PageDown:()=>go(10)};
  if(m[e.key]){e.preventDefault();m[e.key]()}
}

init();
})();
</script>
